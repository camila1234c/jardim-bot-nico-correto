<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Jardim Botânico</title>
    <link rel="stylesheet" href="../CSS/contato.css">
</head>

<body>

    <header>
        <h1>Jardim Botânico 🌷</h1>
        <p>Faça seu pedido ou entre em contato conosco</p>
    </header>

    <section class="container">
        <h2>Formulário de Contato</h2>

        <form>
            <label>Nome Completo</label>
            <input type="text" placeholder="Digite aqui" required>

            <label>Número / WhatsApp</label>
            <input type="tel" placeholder="Seu número">

            <label>E-mail</label>
            <input type="email" placeholder="Digite seu e-mail" required>

            <label>O que deseja?</label>
            <select required>
                <option value="">Selecione</option>
                <option>Buquê de Flores</option>
                <option>Arranjo Floral</option>
                <option>Cesta de Presentes</option>
                <option>Decoração para Eventos</option>
                <option>Outro</option>
            </select>

            <label>Endereço para entrega</label>
            <input type="text" placeholder="Digite seu endereço">

            <label>Data desejada para entrega</label>
            <input type="date">

            <label>Detalhes do pedido</label>
            <textarea placeholder="Mensagem"></textarea>

            <button type="submit">Enviar Pedido</button>
        </form>
    </section>

</body>

</html>
