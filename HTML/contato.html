<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Jardim Botânico</title>
    <link rel="stylesheet" href="../CSS/contato.css">
</head>

<body>

    <div class="contato-container">
        <div class="logo">🌿</div>
        <h1>Jardim Botânico</h1>
        <p class="subtitulo">Faça seu pedido de flores</p>

        <form>
            <div class="input-group">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="input-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="Digite seu número" required>
            </div>

            <div class="input-group">
                <label for="endereco">Endereço para entrega</label>
                <input type="text" id="endereco" placeholder="Digite seu endereço" required>
            </div>

            <div class="input-group">
                <label for="pedido">O que deseja?</label>
                <input type="text" id="pedido" placeholder="Ex: Buquê de rosas, orquídeas..." required>
            </div>

            <div class="input-group">
                <label for="data">Data desejada para entrega</label>
                <input type="date" id="data" required>
            </div>

            <div class="input-group">
                <label for="detalhes">Detalhes do pedido</label>
                <textarea id="detalhes" placeholder="Mensagem para o cartão, cores, observações..." required></textarea>
            </div>
            <button type="submit" class="contato-btn">Enviar Pedido</button>
            <a href="inicio.html" class="voltar-btn">Voltar para Página Inicial</a>
            <div class="footer">
                Ou fale conosco pelo WhatsApp <a href="#">(92) 99999-9999</a>
            </div>

    </div>

</body>

</html>
