<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floricultura</title>
    <link rel="stylesheet" href="../CSS/floricultura.css">
</head>
    <body>

    <div class="container">
        <h1>Floricultura</h1>
        
        <div class="flowers-grid">
            
            <div class="flower-card">
                <div class="flower-header">
                    <div class="marker"></div>
                    <span class="flower-name">Tulipa</span>
                </div>
                <img class="flower-image" src="https://i.pinimg.com/736x/4a/fd/a6/4afda68549f1f76b688cecdf3fa89024.jpg" alt="Tulipas Rosa">
            </div>

            <div class="flower-card">
                <div class="flower-header">
                    <div class="marker"></div>
                    <span class="flower-name">Íris</span>
                </div>
                <img class="flower-image" src="https://i.pinimg.com/1200x/14/64/7a/14647a6668b7c99d879b89685901308d.jpg" alt="Flor Íris Roxa">
            </div>

            <div class="flower-card">
                <div class="flower-header">
                    <div class="marker"></div>
                    <span class="flower-name">Rosa</span>
                </div>
                <img class="flower-image" src="https://i.pinimg.com/736x/e9/28/d2/e928d2915b465c4094f2f2d690dfa368.jpg" alt="Rosas Vermelhas">
            </div>

            <div class="flower-card">
                <div class="flower-header">
                    <div class="marker"></div>
                    <span class="flower-name">Hortênsia</span>
                </div>
                <img class="flower-image" src="https://i.pinimg.com/736x/a6/0a/fd/a60afd8b3fc9126efa1582638770f508.jpg" alt="Hortênsia Azul">
            </div>

        </div>
    </div>

</body>
</html>
