<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendas</title>
    <link rel="stylesheet" href="../CSS/venda.css">

<body>
    <header>
        <h1>Floricultura</h1>
        <p>Escolha sua flor favorita 🌸</p>
    </header>
    <section class="produtos">
        <div class="card">
            <img src="https://www.infoescola.com/wp-content/uploads/2010/05/tulipa_645862144.jpg" alt="Tulipa">
            <div class="info">
                <h2>Tulipa</h2>
                <p class="preco">R$ 29,90</p>
                <button>Comprar</button>
            </div>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTQ6EWxdMP-hAnSi7obodXeNUIcY6Gi-a2chQ&s" alt="Íris">
            <div class="info">
                <h2>Íris</h2>
                <p class="preco">R$ 35,90</p>
                <button>Comprar</button>
            </div>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBsve4AiQv7aGejOeSAxOR1lvMOkeHKSEOEg&s" alt="Rosa">
            <div class="info">
                <h2>Rosa</h2>
                <p class="preco">R$ 25,90</p>
                <button>Comprar</button>
            </div>
        </div>
        <div class="card">
            <img src="https://cdn.awsli.com.br/600x450/18/18885/produto/49851088/0e5ed56c33.jpg" alt="Hortênsia">
            <div class="info">
                <h2>Hortênsia</h2>
                <p class="preco">R$ 42,90</p>
                <button>Comprar</button>
            </div>
        </div>
    </section>
</body>

</html>
